name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the current host; Linux is where the NAS port will run.
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          python-version: ${{ matrix.python }}

      - name: Install
        # setup-uv with python-version has already created and activated .venv, so this
        # installs into the matrix interpreter. Do not add `uv venv` here — it errors if
        # a venv already exists. Installing --system instead would target the runner's
        # system Python, which is externally managed on Ubuntu and ignores the matrix.
        run: uv pip install ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # The suite is hermetic: a stub rclone stands in for the real binary, so no
        # network access and no credentials are involved.
        run: uv run pytest -q

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Install from wheel and smoke-test the entry point
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/photocopier --version
