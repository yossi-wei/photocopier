name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the current host; Linux is where the NAS port will run.
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          python-version: ${{ matrix.python }}
          # Required from v6 onwards. Until v5, python-version implicitly created and
          # activated .venv at the repo root; that is now opt-in. Without this the
          # Install step below would have nowhere to install to.
          activate-environment: true

      - name: Install
        # setup-uv has created and activated .venv on the matrix interpreter, so this
        # installs into it. Do not add `uv venv` here — it errors if a venv already
        # exists. Installing --system instead would target the runner's system Python,
        # which is externally managed on Ubuntu and ignores the matrix entirely.
        run: uv pip install ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # The suite is hermetic: a stub rclone stands in for the real binary, so no
        # network access and no credentials are involved.
        run: uv run pytest -q

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No activate-environment here: this job builds its own venv at /tmp/check to
      # prove the wheel installs cleanly from scratch, the way someone cloning would.
      - uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Install from wheel and smoke-test the entry point
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/photocopier --version
